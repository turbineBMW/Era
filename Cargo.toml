[package]
name = "era"
version = "0.1.0"
authors = ["Titouan Real <titouan.real@gmail.com>"]
edition = "2024"

[profile.release]
lto = true
codegen-units = 1

[dependencies]
adw = { package = "libadwaita", version = "0.9.1", features = ["v1_9", "gtk_v4_22", "gio_v2_80"] }
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "settings", "file_chooser", "open_uri"] }
clepsydre = { package = "clepsydre-rebind", git = "https://gitlab.gnome.org/TitouanReal/clepsydre.git" }
clepsydre-android = { package = "clepsydre-android", git = "https://gitlab.gnome.org/TitouanReal/clepsydre.git", optional = true }
clepsydre-eds = { package = "clepsydre-eds", git = "https://gitlab.gnome.org/TitouanReal/clepsydre.git", optional = true }
clepsydre-mock = { package = "clepsydre-mock", git = "https://gitlab.gnome.org/TitouanReal/clepsydre.git", optional = true }
clepsydre-p2panda = { package = "clepsydre-p2panda", git = "https://gitlab.gnome.org/TitouanReal/clepsydre.git", optional = true }
futures-util = "0.3.32"
gettext-rs = { version = "0.7.7", features = ["gettext-system"] }
gio = { version = "0.22.2", features = ["v2_86"] }
glib = { version = "0.22.2", features = ["v2_86"] }
gdk = { package = "gdk4", version = "0.11.0", features = ["v4_22"] }
gtk = { package = "gtk4", version = "0.11.0", features = ["gnome_49", "v4_22", "blueprint"] }
gvdb-macros = "0.1.16"
jiff = "0.2.22"
qrcode = "0.14.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
url = "2.5.8"

[features]
default = ["backend-eds", "platform-flatpak"]

backend-android = ["dep:clepsydre-android"]
backend-eds = ["dep:clepsydre-eds"]
backend-mock = ["dep:clepsydre-mock"]
backend-p2panda = ["dep:clepsydre-p2panda"]

platform-flatpak = []
platform-android = []

# fork: the phone layout (src/widgets/phone.rs), for phone shells such as
# omarchy-mobile's: one page at a time, nothing to press at the top; a tap on
# a day opens its agenda (month_view_paged.rs).
phone = []
