include:
    - project: "GNOME/citemplates"
      file: "templates/default-rules.yml"
    - project: "GNOME/citemplates"
      file: "flatpak/flatpak_ci_initiative.yml"

variables:
    FLATPAK_MODULE: "era"

.eds:
    variables:
        MANIFEST_PATH: "build-aux/io.gitlab.TitouanReal.Era.Eds.Devel.json"
        APP_ID: "io.gitlab.TitouanReal.Era.Eds.Devel"
        BUNDLE: "era-eds-nightly.flatpak"

.mock:
    variables:
        MANIFEST_PATH: "build-aux/io.gitlab.TitouanReal.Era.Mock.Devel.json"
        APP_ID: "io.gitlab.TitouanReal.Era.Mock.Devel"
        BUNDLE: "era-mock-nightly.flatpak"

.p2panda:
    variables:
        MANIFEST_PATH: "build-aux/io.gitlab.TitouanReal.Era.P2panda.Devel.json"
        APP_ID: "io.gitlab.TitouanReal.Era.P2panda.Devel"
        BUNDLE: "era-p2panda-nightly.flatpak"

.rust-nightly@x86_64:
    before_script:
        - flatpak install flathub org.freedesktop.Sdk.Extension.rust-nightly/x86_64/25.08 --user -y

.rust-nightly@aarch64:
    before_script:
        - flatpak install flathub org.freedesktop.Sdk.Extension.rust-nightly/aarch64/25.08 --user -y

stages:
    - check
    - build
    - test

cargo-fmt:
    image: "${RUNTIME_IMAGE}"
    stage: check
    tags:
        - flatpak
    variables:
        MANIFEST_PATH: "build-aux/io.gitlab.TitouanReal.Era.Eds.Devel.json"
        APP_ID: "io.gitlab.TitouanReal.Era.Eds.Devel"
        COMMAND: "cargo fmt"
    script:
        - flatpak install --user org.freedesktop.Sdk.Extension.rust-nightly/x86_64/25.08 -y
        - flatpak-builder --user --disable-rofiles-fuse --keep-build-dirs --stop-at=${FLATPAK_MODULE} flatpak_app ${MANIFEST_PATH}
        - flatpak build-finish --share=network flatpak_app
        - echo "cd .. && ${COMMAND}" | flatpak-builder --user --disable-rofiles-fuse --build-shell=${FLATPAK_MODULE} flatpak_app ${MANIFEST_PATH}
    interruptible: true

cargo-clippy:
    image: "${RUNTIME_IMAGE}"
    stage: check
    tags:
        - flatpak
    variables:
        MANIFEST_PATH: "build-aux/io.gitlab.TitouanReal.Era.Eds.Devel.json"
        APP_ID: "io.gitlab.TitouanReal.Era.Eds.Devel"
        COMMAND: "cargo clippy -- -D warnings"
    script:
        - flatpak install --user org.freedesktop.Sdk.Extension.rust-nightly/x86_64/25.08 -y
        - flatpak-builder --user --disable-rofiles-fuse --keep-build-dirs --stop-at=${FLATPAK_MODULE} flatpak_app ${MANIFEST_PATH}
        - flatpak build-finish --share=network flatpak_app
        - echo "cd .. && ${COMMAND}" | flatpak-builder --user --disable-rofiles-fuse --build-shell=${FLATPAK_MODULE} flatpak_app ${MANIFEST_PATH}
    interruptible: true

blueprint-format:
    stage: check
    image: "quay.io/gnome_infrastructure/gnome-build-meta:core-nightly"
    before_script:
        - shopt -s globstar
    script:
        - blueprint-compiler format **/*.blp
    interruptible: true

blueprint-lint:
    stage: check
    image: "quay.io/gnome_infrastructure/gnome-build-meta:core-nightly"
    when: manual
    before_script:
        - shopt -s globstar
    script:
        - blueprint-compiler lint **/*.blp
    allow_failure: true
    interruptible: true

flatpak-eds@x86_64:
    extends:
        - .flatpak@x86_64
        - .rust-nightly@x86_64
        - .eds
    stage: build
    # Do the following to prepare for the lint-metainfo job.
    after_script:
        # Copy the metainfo file to the current directory.
        - cp flatpak_app/files/share/metainfo/*.metainfo.xml .
    artifacts:
        paths:
            - $BUNDLE
            - "repo.tar"
            - ".flatpak-builder/build/${FLATPAK_MODULE}/_flatpak_build/meson-logs/"
            # Add the metainfo file for the corresponding test.
            - "${APP_ID}.metainfo.xml"

flatpak-eds@aarch64:
    extends:
        - .flatpak@aarch64
        - .rust-nightly@aarch64
        - .eds
    stage: build
    when: manual

flatpak-mock@x86_64:
    extends:
        - .flatpak@x86_64
        - .rust-nightly@x86_64
        - .mock
    stage: build

flatpak-mock@aarch64:
    extends:
        - .flatpak@aarch64
        - .rust-nightly@aarch64
        - .mock
    stage: build
    when: manual

flatpak-p2panda@x86_64:
    extends:
        - .flatpak@x86_64
        - .rust-nightly@x86_64
        - .p2panda
    stage: build

flatpak-p2panda@aarch64:
    extends:
        - .flatpak@aarch64
        - .rust-nightly@aarch64
        - .p2panda
    stage: build
    when: manual

# Validate the metainfo with Flathub's tool.
lint-metainfo:
    stage: test
    image:
        name: "ghcr.io/flathub/flatpak-builder-lint:latest"
        entrypoint: [""]
    variables:
        APP_ID: "io.gitlab.TitouanReal.Era.Eds.Devel"
        METAINFO: "${APP_ID}.metainfo.xml"
    interruptible: true
    script:
        # This tool has extra tests on top of appstreamcli and is required to pass for Flathub.
        - flatpak-builder-lint appstream ${METAINFO}
        # Test also with the pedantic and strict flags.
        - appstreamcli validate --pedantic --explain --strict ${METAINFO}
    needs: ["flatpak-eds@x86_64"]
